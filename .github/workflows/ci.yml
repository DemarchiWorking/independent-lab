name: CI

# Só verifica. A publicação na VPS é manual e consciente (deploy/publicar.sh):
# a VPS é compartilhada com outros projetos e uma chave de deploy guardada no
# GitHub daria acesso de root a todos eles.
on:
  push:
    branches: [main, seguranca-producao]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Ações fixadas pelo SHA do commit (uma tag pode ser movida por quem
      # controla o repositório da ação). Para atualizar:
      #   git ls-remote --tags https://github.com/actions/<acao>.git 'refs/tags/v4*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Build de produção
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://exemplo.invalid
