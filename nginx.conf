user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # 4096 (era 1024) — Épico 13 (escala): com `worker_processes auto` (1
    # por vCPU desta VPS) e conexões `keep-alive` do navegador, 1000
    # jogadores concorrentes usam bem mais que 1 conexão TCP cada. Realtime
    # (WebSocket de presença) NÃO passa por aqui — fala direto com o
    # Supabase (`BMAD-MULTIPLAYER-VPS.md` §3.3.1) — este teto é só HTTP/SSR.
    worker_connections 4096;
    multi_accept       on;
    use                epoll;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout 65;
    client_max_body_size 5m;

    # Duas zonas (mesmo desenho de deploy/nginx-limits.conf.template, modo
    # PM2/host — replicado aqui porque `limit_req_zone` só vale no nível
    # http{}, e este arquivo SUBSTITUI o nginx.conf padrão do container):
    #   gamehub_geral → navegação normal do jogo.
    #   gamehub_auth  → só /entrar e /cadastro, mais apertada contra força
    #                   bruta/spam de conta.
    limit_req_zone $binary_remote_addr zone=gamehub_geral:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=gamehub_auth:10m  rate=5r/s;
    limit_req_status 429;

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml
        font/woff2 font/woff;

    # Épico 13 (escala 100–1000 simultâneos): `app` agora sobe com
    # `deploy.replicas` (docker-compose.yml) — um `upstream { server
    # app:3000; }` estático resolveria o hostname UMA vez no boot do Nginx e
    # sempre bateria na mesma réplica (limitação conhecida do Nginx open
    # source: `upstream` com `server <hostname>` não faz round-robin de
    # múltiplos IPs de um mesmo nome). `resolver 127.0.0.11` (DNS embutido
    # do Docker) + `proxy_pass` por variável força reresolução periódica —
    # o DNS do Docker já roda round-robin entre as réplicas vivas a cada
    # resolução, então o efeito prático é balanceamento entre elas.
    #
    # Trade-off aceito e documentado: perde-se o `keepalive` de upstream que
    # o `upstream{}` estático tinha (Nginx open source não sustenta pool de
    # conexão keepalive com proxy_pass por variável) — cada requisição abre
    # uma conexão nova pro app, num hop de rede interna Docker (latência
    # sub-milissegundo). Aceitável nesta escala; `deploy/loadtest/
    # presenca-k6.js` mede se isso aparece na prática antes de qualquer
    # go-live.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options   "nosniff"                          always;
        add_header X-Frame-Options          "SAMEORIGIN"                       always;
        add_header X-XSS-Protection         "1; mode=block"                    always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        proxy_hide_header X-Powered-By;

        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;

        # Health check do próprio nginx (usado pelo `healthcheck:` do compose)
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Health check da app (passthrough) — mesmo endpoint que o modo PM2 usa
        location = /api/health {
            set $upstream_app app:3000;
            proxy_pass            http://$upstream_app;
            proxy_http_version    1.1;
            proxy_set_header      Host              $http_host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    5s;
            access_log off;
        }

        # login/cadastro — alvo natural de força bruta/spam, zona mais apertada
        location ~ ^/(entrar|cadastro)$ {
            limit_req zone=gamehub_auth burst=10 nodelay;
            set $upstream_app app:3000;
            proxy_pass            http://$upstream_app;
            proxy_http_version    1.1;
            proxy_set_header      Host              $http_host;
            proxy_set_header      X-Forwarded-Host  $http_host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_redirect         off;
            proxy_hide_header     X-Powered-By;
        }

        # Assets Next.js — hash no nome, cache agressivo seguro, sem rate limit
        # (dezenas de requisições por navegação normal).
        location /_next/static/ {
            set $upstream_app app:3000;
            proxy_pass        http://$upstream_app;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
            add_header        Cache-Control     "public, max-age=31536000, immutable";
            proxy_hide_header X-Powered-By;
        }

        location ~* \.(ico|png|jpg|jpeg|gif|webp|avif|svg|woff|woff2|ttf|otf)$ {
            set $upstream_app app:3000;
            proxy_pass        http://$upstream_app;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
            add_header        Cache-Control     "public, max-age=86400";
            proxy_hide_header X-Powered-By;
        }

        # App (SSR, API routes, Server Actions). Nota: Realtime/Presence do
        # Supabase (GH-MULTI-*) fala DIRETO com o Supabase a partir do
        # browser — nunca atravessa este proxy (ver
        # docs/architecture/BMAD-MULTIPLAYER-VPS.md §3.3.1) — por isso não
        # há timeout estendido de WebSocket aqui, diferente do
        # nginx-supabase.conf.template (modo PM2) que fala com o Kong.
        location / {
            limit_req zone=gamehub_geral burst=40 nodelay;
            set $upstream_app app:3000;
            proxy_pass             http://$upstream_app;
            proxy_http_version     1.1;
            proxy_set_header       Host              $http_host;
            proxy_set_header       X-Forwarded-Host  $http_host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       Upgrade           $http_upgrade;
            proxy_set_header       Connection        "upgrade";
            proxy_cache_bypass     $http_upgrade;
            proxy_read_timeout     60s;
            proxy_send_timeout     60s;
            proxy_connect_timeout  10s;
            proxy_redirect         off;
            proxy_hide_header      X-Powered-By;
        }
    }
}
