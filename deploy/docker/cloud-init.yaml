#cloud-config
# ============================================================================
# labdatadev-gamehub — provisionamento "1-click" de uma VPS/cloud NOVA.
#
# Genérico de propósito: `cloud-init` já vem pré-instalado nas imagens
# Ubuntu padrão de praticamente todo provedor (DigitalOcean, Hetzner, AWS
# EC2, GCP, Hostinger, Vultr, Linode...) — cole este arquivo inteiro no
# campo "User Data" / "Cloud-init" / "Startup script" na hora de criar a
# VM. Sem passo manual nenhum depois: a VM sobe já com o app rodando.
#
# O que faz: instala git, clona o repo, roda deploy/docker/setup.sh (que
# por sua vez instala Docker se faltar e sobe app + nginx + Supabase
# self-hosted vendorizado — stack completo, sem depender de nada
# pré-existente na VM).
#
# Ajuste as 3 linhas abaixo antes de usar:
#   REPO_URL    — HTTPS do repositório (se privado, use um deploy token/PAT
#                 embutido na URL: https://<token>@github.com/...)
#   REPO_BRANCH — branch com a camada de deploy (hoje: integracao-deploy-vps
#                 — ver docs/PROXIMA-TAREFA.md, ainda não fundida na main)
#   REPO_DIR    — onde clonar (padrão: /root/labdatadev-gamehub)
#
# Roda inteiro como root (`runcmd` do cloud-init já executa como root em
# toda imagem cloud padrão) — de propósito, acabou com uma classe inteira de
# bug (achado DevOps, 2026-08-02, F6): a versão anterior assumia um usuário
# `ubuntu` fixo (`chown -R ubuntu:ubuntu ... || true`, `sudo -u ubuntu`), que
# não existe em toda imagem (Debian usa `debian`, algumas imagens só têm
# `root`), e o `|| true` engolia o erro do chown silenciosamente — a falha
# real só aparecia depois, no `sudo -u ubuntu`, sem pista do motivo.
# `deploy/docker/setup.sh` já lida com rodar como root explicitamente (ver
# comentário "GH-ESC-05" no próprio script), então não há motivo pra sair
# do papel de root aqui.
# ============================================================================

package_update: true
package_upgrade: false

packages:
  - git
  - ca-certificates
  - curl
  - ufw

write_files:
  - path: /etc/labdatadev-gamehub-cloud-init.env
    permissions: "0600"
    content: |
      REPO_URL=https://github.com/DemarchiWorking/independent-lab.git
      REPO_BRANCH=integracao-deploy-vps
      REPO_DIR=/root/labdatadev-gamehub
      # Flags passadas pro setup.sh — troque para "" (vazio) se quiser só
      # GAMEHUB_DB=file (sem Postgres), ou pra "--with-supabase --labd-cloud"
      # só se esta VM for especificamente a VPS labd.cloud (ver nota em
      # docker-compose.labd-cloud.yml antes de usar --labd-cloud em outro lugar).
      SETUP_FLAGS=--with-supabase

runcmd:
  # GH-ESC-05 (achado de auditoria, 2026-08-01): `source` não existe no
  # `/bin/sh` (dash) que o cloud-init usa para rodar `runcmd` — precisa ser
  # o builtin POSIX `.`, senão as 3 variáveis abaixo ficam vazias e o clone
  # falha silenciosamente.
  - . /etc/labdatadev-gamehub-cloud-init.env
  - |
    if [ ! -d "$REPO_DIR" ]; then
      git clone --branch "$REPO_BRANCH" "$REPO_URL" "$REPO_DIR"
    else
      echo "Repo já existe em $REPO_DIR — pulando clone (rode git pull manualmente se quiser atualizar)."
    fi
  - cd "$REPO_DIR" && bash "./deploy/docker/setup.sh" $SETUP_FLAGS 2>&1 | tee /var/log/labdatadev-gamehub-setup.log
  # Firewall (achado DevOps, F7): sem isto, só a porta 22 do provedor
  # protege a VM — 3006 (app) e 8010 (Kong) ficam em 0.0.0.0 sem defesa
  # de rede nenhuma além do `key-auth`/`acl` do próprio Kong. `ufw` some
  # dentro do container/imagens minimalistas às vezes; `|| true` aqui é
  # aceitável porque não mascara o setup em si (já rodou e logou acima) —
  # só a camada extra de firewall.
  - ufw allow 22/tcp || true
  - ufw allow 3006/tcp || true
  - ufw allow 8010/tcp || true
  - ufw --force enable || true

final_message: |
  labdatadev-gamehub provisionado em $UPTIME segundos.
  Log completo do setup: /var/log/labdatadev-gamehub-setup.log
  Health check: curl http://127.0.0.1:3006/api/health
