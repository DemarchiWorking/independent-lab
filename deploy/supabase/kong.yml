# ==============================================================================
# labdatadev-gamehub — roteamento Kong para o Supabase self-hosted (Bloco 2).
#
# TEMPLATE: `__ANON_KEY__`/`__SERVICE_ROLE_KEY__` são trocados pelo `entrypoint`
# do serviço `kong` em docker-compose.yml antes do Kong subir. Nunca edite o
# `kong.yml` gerado dentro do container — edite este arquivo.
#
# Três serviços expostos, batendo com o `client.ts` do app
# (NEXT_PUBLIC_SUPABASE_URL + /auth/v1, /rest/v1, /realtime/v1 — é o supabase-js
# quem monta esses sufixos sozinho):
#   /auth/v1/*      → GoTrue      (login/cadastro — Bloco 1)
#   /rest/v1/*      → PostgREST   (hoje sem uso direto do browser; a app
#                                  server-side já fala com o Postgres via
#                                  `service_role`, mas a rota fica pronta)
#   /realtime/v1/*  → Realtime    (presença ao vivo — Bloco 5)
#
# `key-auth` + `acl` em rest/realtime são o portão de entrada do Kong (só
# quem carrega `apikey: <anon ou service_role>` passa) — a autorização FINA
# continua sendo o JWT (`Authorization: Bearer`) validado por PostgREST/GoTrue
# e a RLS do Postgres. `/auth/v1` fica sem esse portão de propósito: é o
# próprio GoTrue quem autentica ali, e exigir `apikey` cedo demais quebraria
# o fluxo padrão do `supabase-js`.
# ==============================================================================

_format_version: "3.0"
_transform: true

services:
  - name: auth-v1
    url: http://auth:9999
    routes:
      - name: auth-v1-all
        paths: ["/auth/v1/"]
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: ["*"]
          credentials: false
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Authorization, apikey, Content-Type, X-Client-Info]

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        paths: ["/rest/v1/"]
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: ["*"]
          credentials: false
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Authorization, apikey, Content-Type, X-Client-Info, Prefer]
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
      - name: acl
        config:
          allow: [anon, service_role]

  # Achado rodando o harness de carga pela 1ª vez de verdade (Épico 13,
  # 2026-08-01): com `hide_credentials: true` (igual ao de `rest-v1` acima),
  # Kong autentica o `apikey` e VALIDA — mas então REMOVE o parâmetro antes
  # de repassar pro upstream. PostgREST não liga pra isso (só olha o JWT
  # `Authorization`), mas o próprio Realtime faz sua PRÓPRIA checagem de
  # `apikey` (independente do Kong) e rejeitava toda conexão com
  # `MissingAPIKey` — nenhum handshake `phx_join` chegava a acontecer, então
  # a presença ao vivo (`GH-MULTI-02/03`) nunca teria funcionado em produção
  # nenhuma vez, mesmo com o resto do stack saudável. `hide_credentials:
  # false` só aqui deixa o Realtime ver o `apikey` que ele mesmo exige — a
  # segurança de borda continua sendo o `key-auth`+`acl` do Kong (que já
  # rejeita antes disso quem não tem `anon`/`service_role`), então isto não
  # abre acesso novo, só para de esconder um dado que o upstream precisa.
  - name: realtime-v1
    # Endpoint Phoenix do Realtime é montado em `/socket` internamente.
    url: http://realtime-dev.gamehub-realtime:4000/socket
    routes:
      - name: realtime-v1-all
        paths: ["/realtime/v1/"]
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: ["*"]
          credentials: false
          methods: [GET, POST, OPTIONS]
          headers: [Authorization, apikey, Content-Type, X-Client-Info]
      - name: key-auth
        config:
          key_names: [apikey]
          # false (diferente do rest-v1 acima) — ver comentário logo acima
          # deste serviço: o próprio Realtime exige ver o `apikey`.
          hide_credentials: false
      - name: acl
        config:
          allow: [anon, service_role]

consumers:
  - username: anon
    keyauth_credentials:
      - key: __ANON_KEY__
    acls:
      - group: anon

  - username: service_role
    keyauth_credentials:
      - key: __SERVICE_ROLE_KEY__
    acls:
      - group: service_role
